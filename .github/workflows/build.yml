name: build-firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ImmortalWrt release (e.g. 25.12.2)"
        required: true
        default: "25.12.2"
      target:
        description: "Target device / platform"
        type: choice
        options:
          - x86-64
          - x86-64-vm
          - gl-mt2500
          - gl-mt2500-airoha
          - nanopi-r5s
          - nanopi-r6s
          - nanopi-r76s
        default: x86-64
      preset:
        description: "Preset (custom uses the modules input)"
        type: choice
        options: [standard, full, lite, rescue, custom]
        default: standard
      modules:
        description: "Only for preset=custom, comma separated (e.g. base,nat,proxy-homeproxy)"
        required: false
        default: ""
      release:
        description: "Publish a GitHub Release with the artifacts"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.target || 'matrix' }}-${{ inputs.preset || '' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install PyYAML
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-yaml
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          TARGET_IN: ${{ inputs.target }}
          PRESET_IN: ${{ inputs.preset }}
          MODULES_IN: ${{ inputs.modules }}
          VERSION_IN: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            matrix="$(python3 scripts/resolve.py matrix --event tag)"
            version="${GITHUB_REF_NAME#v}"
          else
            matrix="$(python3 scripts/resolve.py matrix --event dispatch \
              --target "$TARGET_IN" --preset "$PRESET_IN" --modules "$MODULES_IN")"
            version="$VERSION_IN"
          fi
          echo "matrix=$matrix"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.target }} / ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Runner resources
        run: |
          df -h /
          free -h
          nproc
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            zstd qemu-utils genisoimage python3-yaml
      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET_NAME: ${{ matrix.target }}
          PRESET: ${{ matrix.preset }}
          MODULES: ${{ matrix.modules }}
        run: bash scripts/build.sh
      - name: Show results
        run: |
          ls -lh dist/images | head -40
          cat dist/BUILDINFO-*.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ needs.plan.outputs.version }}-${{ matrix.target }}-${{ matrix.preset }}
          path: dist/**
          retention-days: 14
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: github.event_name == 'push' || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List assets
        run: ls -lh artifacts | head -60
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists, uploading assets"
          else
            gh release create "$TAG" \
              --title "ImmortalWrt $TAG (multi-target)" \
              --notes "ImageBuilder builds for x86-64, x86-64 VM and supported ARM64 devices. Per-target BUILDINFO and SHA256SUMS record provenance. None of these images is hardware-tested." \
              || gh release view "$TAG" >/dev/null
          fi
          find artifacts -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
